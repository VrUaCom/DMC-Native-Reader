# ARCHIVED WORKFLOW — NOT EXECUTED BY GITHUB ACTIONS
#
# Historical snapshot preserved for evidence/reference only.
# Removed from .github/workflows during v33 C++23 migration because it can use
# production signing authority under obsolete v1.0.1 / NDK r28 assumptions.
# Do not copy this back as release authority. Phase 7 (#40) must create the
# current release path from #55-reviewed architecture and exact signed-artifact
# evidence.
#
name: DMC Native Reader v1 production release

# LEGACY / MANUAL ONLY during the C++23 migration.
# This workflow still encodes the v1.0.1 / NDK r28 release contract and must not
# run automatically or become v33 release authority. Gate #44 owns its later
# migration/replacement after the Native Reader core transition is complete.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Restore existing v1 production signing authority
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.DMC_NATIVE_READER_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.DMC_NATIVE_READER_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.DMC_NATIVE_READER_RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.DMC_NATIVE_READER_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/dmc-native-reader-release-v1.jks
          printf '%s\n' "$RELEASE_STORE_PASSWORD" > /tmp/release-store-passphrase.txt
          printf '%s\n' "$RELEASE_KEY_PASSWORD" > /tmp/release-key-passphrase.txt
          printf '%s\n' "$RELEASE_KEY_ALIAS" > /tmp/release-key-alias.txt
          keytool -list \
            -keystore /tmp/dmc-native-reader-release-v1.jks \
            -storepass:file /tmp/release-store-passphrase.txt \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null

      - name: Sign v1.0.1 release APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="/tmp/DMC-Native-Reader-v1.0.1.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          ALIAS="$(cat /tmp/release-key-alias.txt)"
          "$APKSIGNER" sign \
            --ks /tmp/dmc-native-reader-release-v1.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass file:/tmp/release-store-passphrase.txt \
            --key-pass file:/tmp/release-key-passphrase.txt \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$UNSIGNED"

      - name: Verify production release identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="/tmp/DMC-Native-Reader-v1.0.1.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"

          unzip -t "$APK"
          "$AAPT2" dump badging "$APK" | tee /tmp/release-badging.txt
          grep -q "package: name='com.dmcrengine.nativereader'" /tmp/release-badging.txt
          grep -q "versionCode='21'" /tmp/release-badging.txt
          grep -q "versionName='1.0.1'" /tmp/release-badging.txt
          grep -q "application-label:'DMC Native Reader'" /tmp/release-badging.txt

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/release-signing.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/release-signing.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/release-signing.txt
          if tr -d ': ' < /tmp/release-signing.txt | grep -qi 'f483539463f89dd957a8f7c68a3bb75da17450163f2e8767b4c47d5f1899adac'; then
            echo 'production release was signed by the development certificate'
            exit 1
          fi

          unzip -p "$APK" lib/arm64-v8a/libdmcviewer.so > /tmp/libdmcviewer.so
          strings /tmp/libdmcviewer.so | grep -Fq 'formats.mod.mesh-reader'
          strings /tmp/libdmcviewer.so | grep -Fq 'formats.scm.mesh-reader'
          strings /tmp/libdmcviewer.so | grep -Fq 'formats.texture.spider-reader'
          strings /tmp/libdmcviewer.so | grep -Fq 'spider.native-executor'
          strings /tmp/libdmcviewer.so | grep -Fq 'native.uv-projection'

          sha256sum "$APK" | tee /tmp/release-apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: DMC-Native-Reader-v1.0.1-production
          path: /tmp/DMC-Native-Reader-v1.0.1.apk
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: DMC-Native-Reader-v1.0.1-release-evidence
          path: |
            /tmp/release-badging.txt
            /tmp/release-signing.txt
            /tmp/release-apk.sha256
          if-no-files-found: error
          retention-days: 90
