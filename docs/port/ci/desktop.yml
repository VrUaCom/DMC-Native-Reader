name: Desktop shells (Linux, Windows MinGW / MSVC, macOS)

# The shells beside Android that share the core: the Linux native shell,
# the Win32 shell and CLI with MinGW (GCC, libstdc++) and MSVC, and the SwiftUI app for macOS.
# Builds and host tests only; nothing is signed or published.
on:
  workflow_dispatch:
  push:
    branches: ["NR-Luna-v73", "platform/linux"]
    paths:
      - "app/src/main/cpp/**"
      - "app/src/test/native/**"
      - "apple/**"
      - "linux/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxext-dev
      - name: Build and test
        run: |
          linux/build-linux.sh --test
      - name: Verify binaries
        run: |
          test -x linux/.build/bin/dmc_native_reader_linux
          test -x linux/.build/bin/dmc_native_reader_cli
          linux/.build/bin/dmc_native_reader_cli || true
  windows-mingw:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: >-
          cmake -S app/src/main/cpp -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDMC_NATIVE_READER_FFMPEG=OFF
          -DDMC_NATIVE_READER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Host tests
        run: ctest --test-dir build --output-on-failure -j 2
      - name: Shell and CLI exist
        run: |
          test -f build/dmc_native_reader_win.exe
          test -f build/dmc_native_reader_cli.exe

  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: >-
          cmake -S app/src/main/cpp -B build
          -DDMC_NATIVE_READER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Host tests
        run: ctest --test-dir build -C Release --output-on-failure -j 2

  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Host tests
        run: |
          cmake -S app/src/main/cpp -B build -DDMC_NATIVE_READER_BUILD_TESTS=ON -DDMC_NATIVE_READER_FFMPEG=OFF
          cmake --build build -j 4
          ctest --test-dir build --output-on-failure -j 2
      - name: macOS app
        run: DMC_FFMPEG=OFF apple/build-mac.sh
