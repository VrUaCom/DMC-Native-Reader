        PRODUCT_NAME: DMC Native Reader
        PRODUCT_MODULE_NAME: DMCNativeReader
        INFOPLIST_FILE: DMCNativeReader/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: DMCNativeReader/Bridge/DMCNativeReader-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../app/src/main/cpp/include
          - $(SRCROOT)/../app/src/main/cpp/vendor/dmc-rengine-cpp/include
        CLANG_CXX_LANGUAGE_STANDARD: c++23
        CLANG_CXX_LIBRARY: libc++
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.73"
        CURRENT_PROJECT_VERSION: "73"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_LANGUAGE: en
        CODE_SIGN_STYLE: Automatic
