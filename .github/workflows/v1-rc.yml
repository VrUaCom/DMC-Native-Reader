name: DMC Native Reader v1 RC gate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Guard RC diff and architecture boundaries
        run: |
          set -euxo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- app/src/main/cpp/vendor/dmc-rengine-cpp | grep -q .; then
              echo 'RC branch must not modify canonical vendor blobs'
              exit 1
            fi
          fi
          grep -q 'versionCode = 18' app/build.gradle.kts
          grep -q 'versionName = "1.0.0-rc1"' app/build.gradle.kts
          ! grep -R -q 'DdsActivity\|PtxActivity\|DdsViewer\|PtxViewer\|ModRenderer\|ScmInspector' app/src/main/java app/src/main/cpp
          ! grep -E -q 'if[[:space:]]*\([^)]*(PTX|DDS)|switch[[:space:]]*\([^)]*(PTX|DDS)' \
            app/src/main/java/com/dmcrengine/nativeviewer/MainActivity.java \
            app/src/main/java/com/dmcrengine/nativeviewer/ChildResourceBrowserView.java

      - name: Build and run modular-reader smoke suite
        run: |
          set -euxo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp/include \
            -Iapp/src/main/cpp/vendor/dmc-rengine-cpp/include \
            app/src/test/native/module_registry_test.cpp \
            app/src/main/cpp/dmc_resource.cpp \
            app/src/main/cpp/decode_status.cpp \
            app/src/main/cpp/decode_hits.cpp \
            app/src/main/cpp/decode_text.cpp \
            app/src/main/cpp/decode_pipeline.cpp \
            app/src/main/cpp/inspection_format.cpp \
            app/src/main/cpp/formats/dds.cpp \
            app/src/main/cpp/adapters/mod_adapter.cpp \
            app/src/main/cpp/adapters/scm_adapter.cpp \
            app/src/main/cpp/modules/module_registry.cpp \
            app/src/main/cpp/modules/module_catalog.cpp \
            app/src/main/cpp/modules/module_model.cpp \
            app/src/main/cpp/modules/module_hits.cpp \
            app/src/main/cpp/modules/module_text.cpp \
            app/src/main/cpp/modules/module_texture.cpp \
            app/src/main/cpp/modules/module_structural.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/binary/reader.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod_skin.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/transform_domain.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/world_transform.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_layout.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_topology.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_validation.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_transform.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_hierarchy.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm.cpp \
            -o /tmp/dmc-module-regression
          /tmp/dmc-module-regression

      - name: Build and run MOD spatial/material smoke suite
        run: |
          set -euxo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp/include \
            -Iapp/src/main/cpp/vendor/dmc-rengine-cpp/include \
            app/src/test/native/mod_spatial_adapter_test.cpp \
            app/src/main/cpp/adapters/mod_adapter.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/binary/reader.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod_skin.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/transform_domain.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/world_transform.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod.cpp \
            -o /tmp/dmc-mod-regression
          /tmp/dmc-mod-regression

      - name: Build and run DDS/PTX malformed and child-resource smoke suite
        run: |
          set -euxo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp/include \
            -Iapp/src/main/cpp/vendor/dmc-rengine-cpp/include \
            app/src/test/native/dds_ptx_v1_test.cpp \
            app/src/main/cpp/dmc_resource.cpp \
            app/src/main/cpp/decode_status.cpp \
            app/src/main/cpp/decode_hits.cpp \
            app/src/main/cpp/decode_text.cpp \
            app/src/main/cpp/decode_pipeline.cpp \
            app/src/main/cpp/inspection_format.cpp \
            app/src/main/cpp/formats/dds.cpp \
            app/src/main/cpp/adapters/mod_adapter.cpp \
            app/src/main/cpp/adapters/scm_adapter.cpp \
            app/src/main/cpp/modules/module_registry.cpp \
            app/src/main/cpp/modules/module_catalog.cpp \
            app/src/main/cpp/modules/module_model.cpp \
            app/src/main/cpp/modules/module_hits.cpp \
            app/src/main/cpp/modules/module_text.cpp \
            app/src/main/cpp/modules/module_texture.cpp \
            app/src/main/cpp/modules/module_structural.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/binary/reader.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod_skin.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/transform_domain.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/world_transform.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_layout.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_topology.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_validation.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_transform.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_hierarchy.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm.cpp \
            -o /tmp/dmc-dds-ptx-regression
          /tmp/dmc-dds-ptx-regression

      - name: Build and run RenderScene and UI-policy smoke suite
        run: |
          set -euxo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp/include \
            app/src/test/native/render_scene_test.cpp \
            app/src/main/cpp/view_renderer.cpp \
            -o /tmp/dmc-render-scene-regression
          /tmp/dmc-render-scene-regression
          rm -rf /tmp/dmc-ui-policy-test
          mkdir -p /tmp/dmc-ui-policy-test
          javac -d /tmp/dmc-ui-policy-test \
            app/src/main/java/com/dmcrengine/nativeviewer/ResourceUiState.java \
            app/src/test/java/com/dmcrengine/nativeviewer/ResourceUiStateTest.java
          java -cp /tmp/dmc-ui-policy-test com.dmcrengine.nativeviewer.ResourceUiStateTest

      - name: Build RC debug and unsigned release APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Verify RC identity, native markers and signing boundary
        run: |
          set -euxo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          unzip -t "$DEBUG_APK"
          unzip -t "$RELEASE_APK"

          "$AAPT2" dump badging "$DEBUG_APK" | tee /tmp/rc-debug-badging.txt
          "$AAPT2" dump badging "$RELEASE_APK" | tee /tmp/rc-release-badging.txt
          for BADGING in /tmp/rc-debug-badging.txt /tmp/rc-release-badging.txt; do
            grep -q "package: name='com.dmcrengine.nativereader'" "$BADGING"
            grep -q "versionCode='18'" "$BADGING"
            grep -q "versionName='1.0.0-rc1'" "$BADGING"
            grep -q "application-label:'DMC Native Reader'" "$BADGING"
            ! grep -q 'DMC Native Reader v8' "$BADGING"
          done

          unzip -p "$DEBUG_APK" lib/arm64-v8a/libdmcviewer.so > /tmp/rc-libdmcviewer.so
          strings /tmp/rc-libdmcviewer.so | grep -q 'canonical.mod.spatial-hierarchy'
          strings /tmp/rc-libdmcviewer.so | grep -q 'canonical.mod.texture-state'
          strings /tmp/rc-libdmcviewer.so | grep -q 'canonical.scm.scene-hierarchy'
          strings /tmp/rc-libdmcviewer.so | grep -q 'formats.dds.base-mip-preview'
          strings /tmp/rc-libdmcviewer.so | grep -q 'formats.ptx.bundle-reader'
          strings /tmp/rc-libdmcviewer.so | grep -q 'children='
          if strings /tmp/rc-libdmcviewer.so | grep -q 'formats.generic.structural-inspector'; then
            echo 'retired wildcard reader reintroduced'
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK" | tee /tmp/rc-debug-signing.txt
          tr -d ': ' < /tmp/rc-debug-signing.txt | grep -qi 'f483539463f89dd957a8f7c68a3bb75da17450163f2e8767b4c47d5f1899adac'
          if "$APKSIGNER" verify "$RELEASE_APK"; then
            echo 'RC release APK unexpectedly signed by a local/test authority'
            exit 1
          fi

          sha256sum "$DEBUG_APK" | tee /tmp/rc-debug.sha256
          sha256sum "$RELEASE_APK" | tee /tmp/rc-release.sha256
          {
            echo "commit=${{ github.sha }}"
            echo 'versionCode=18'
            echo 'versionName=1.0.0-rc1'
            echo 'releaseSigning=UNSIGNED_PENDING_PRODUCTION_AUTHORITY'
          } | tee /tmp/rc-summary.txt

      - name: Upload RC debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dmc-native-reader-v1.0.0-rc1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned RC release APK
        uses: actions/upload-artifact@v4
        with:
          name: dmc-native-reader-v1.0.0-rc1-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload RC evidence
        uses: actions/upload-artifact@v4
        with:
          name: dmc-native-reader-v1.0.0-rc1-evidence
          path: |
            /tmp/rc-debug-badging.txt
            /tmp/rc-release-badging.txt
            /tmp/rc-debug-signing.txt
            /tmp/rc-debug.sha256
            /tmp/rc-release.sha256
            /tmp/rc-summary.txt
          if-no-files-found: error
