name: DMC Native Reader iOS

on:
  push:
    # Feature branches are included: the iOS target cannot be built on the
    # Linux dev container at all, so a macOS runner is the only place its Swift
    # and Objective-C++ are ever compiled.
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The decoder is shared with the Android app, so the same host checks run
      # here against Apple clang before the app itself is built.
      - name: Run native decoder tests
        run: |
          set -euxo pipefail
          clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Iapp/src/main/cpp/include \
            app/src/test/native/hits_decode_test.cpp \
            app/src/main/cpp/decode_hits.cpp \
            -o /tmp/hits_decode_test
          /tmp/hits_decode_test
          clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Iapp/src/main/cpp/include \
            app/src/test/native/text_decode_test.cpp \
            app/src/main/cpp/decode_text.cpp \
            -o /tmp/text_decode_test
          /tmp/text_decode_test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euxo pipefail
          cd ios
          xcodegen generate
          test -d DMCReader.xcodeproj

      # Simulator build needs no signing identity, so this verifies the whole
      # app compiles and links without an Apple Developer account.
      - name: Build for iOS Simulator
        run: |
          set -euxo pipefail
          xcodebuild \
            -project ios/DMCReader.xcodeproj \
            -scheme DMCReader \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify bundle identity and declared document types
        run: |
          set -euxo pipefail
          APP="build-sim/Build/Products/Debug-iphonesimulator/DMCReader.app"
          test -d "$APP"
          PLIST="$APP/Info.plist"
          # Build settings must have been substituted, not left as literals:
          # a bundle without a real identifier will not install on a device.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" \
            | grep -qx 'com.dmcrengine.nativereader'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST" \
            | grep -qx 'DMCReader'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST" \
            | grep -qx '0.10.1'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST" \
            | grep -qx '11'
          for uti in scm mod hits index ukn; do
            /usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations' "$PLIST" \
              | grep -q "com.dmcrengine.$uti"
          done
          /usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$PLIST" \
            | grep -qi true
          # public.plain-text must never be claimed: it would put this reader in
          # the iOS "Open with" sheet for every text file on the device.
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes' "$PLIST" \
              | grep -q 'public.plain-text'; then
            echo 'unexpected public.plain-text document type' >&2
            exit 1
          fi

      # A device-architecture build with signing switched off. The result is a
      # real installable payload for every sideloading tool that signs with the
      # user's own Apple ID (AltStore, SideStore, Sideloadly); it is NOT
      # installable by tapping it, because nothing here holds an Apple
      # Developer identity to sign with.
      - name: Build unsigned device app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project ios/DMCReader.xcodeproj \
            -scheme DMCReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          APP="build-device/Build/Products/Release-iphoneos/DMCReader.app"
          test -d "$APP"
          # An IPA is a zip whose payload lives under Payload/<Name>.app —
          # exactly the layout the sideloading tools expect to re-sign.
          rm -rf payload-staging
          mkdir -p payload-staging/Payload
          cp -R "$APP" payload-staging/Payload/
          (cd payload-staging && zip -qry ../DMCReader-unsigned.ipa Payload)
          unzip -l DMCReader-unsigned.ipa | grep -q 'Payload/DMCReader.app/DMCReader'
          # Confirm it really is a device build and really is unsigned, so the
          # artifact is never mistaken for something tappable.
          file "$APP/DMCReader" | grep -q 'arm64'
          if codesign -dv "$APP" 2>&1 | grep -q 'Signature=adhoc\|Authority='; then
            echo 'unexpected signature on the unsigned build' >&2
            exit 1
          fi
          ls -la DMCReader-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: dmc-reader-ios-unsigned-ipa
          path: DMCReader-unsigned.ipa
          if-no-files-found: error

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: dmc-reader-ios-simulator
          path: build-sim/Build/Products/Debug-iphonesimulator/DMCReader.app
          if-no-files-found: error
