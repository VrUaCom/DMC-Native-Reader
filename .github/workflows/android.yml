name: DMC Test Reader Android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify standalone Test Reader and modular pipeline
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libdmcviewer.so'

          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.dmcrengine.testreader'" /tmp/badging.txt
          grep -q "versionCode='1'" /tmp/badging.txt
          grep -q "versionName='0.1.0-modular-test-reader'" /tmp/badging.txt
          grep -q "application-label:'DMC Test Reader'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.dmcrengine.nativeviewer.MainActivity'" /tmp/badging.txt

          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | tee /tmp/manifest-tree.txt
          grep -q 'com.dmcrengine.nativeviewer.DmcOpenActivity' /tmp/manifest-tree.txt
          grep -q 'application/vnd.dmc.scm' /tmp/manifest-tree.txt
          grep -q 'application/vnd.dmc.mod' /tmp/manifest-tree.txt
          grep -q 'application/vnd.dmc.efm' /tmp/manifest-tree.txt
          grep -q 'application/vnd.dmc.mrp' /tmp/manifest-tree.txt
          grep -q 'application/vnd.dmc.shw' /tmp/manifest-tree.txt

          if grep -q 'com.dmcrengine.nativereader' /tmp/badging.txt; then
            echo 'standalone Test Reader unexpectedly uses Native Reader applicationId' >&2
            exit 1
          fi
          if grep -q 'HITS\$' /tmp/manifest-tree.txt; then
            echo 'rejected HITS$ identity unexpectedly present in Android routing' >&2
            exit 1
          fi

          unzip -p "$APK" lib/arm64-v8a/libdmcviewer.so > /tmp/libdmcviewer.so
          strings /tmp/libdmcviewer.so | grep -q 'identity-probe'
          strings /tmp/libdmcviewer.so | grep -q 'efm-family-adapter'
          strings /tmp/libdmcviewer.so | grep -q 'mrp-render-family-adapter'
          strings /tmp/libdmcviewer.so | grep -q 'shw-shadow-family-adapter'
          strings /tmp/libdmcviewer.so | grep -q 'efm-vertex-stream-binding'
          strings /tmp/libdmcviewer.so | grep -q 'shw-external-spatial-pool-binding'

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/signing.txt
          tr -d ': ' < /tmp/signing.txt | grep -qi 'f483539463f89dd957a8f7c68a3bb75da17450163f2e8767b4c47d5f1899adac'
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dmc-test-reader-v1-modular
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: dmc-test-reader-v1-build-evidence
          path: |
            /tmp/badging.txt
            /tmp/manifest-tree.txt
            /tmp/signing.txt
            /tmp/apk.sha256
          if-no-files-found: error
