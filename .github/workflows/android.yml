name: DMC Native Reader core architecture

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Reject archived legacy source paths
        run: |
          set -euxo pipefail
          for path in \
            app/src/main/cpp/decode_hits.cpp \
            app/src/main/cpp/decode_text.cpp \
            app/src/main/cpp/decode_status.cpp \
            app/src/main/cpp/modules/module_hits.cpp \
            app/src/main/cpp/modules/module_text.cpp \
            app/src/main/cpp/modules/module_structural.cpp \
            app/src/main/cpp/modules/module_catalog.cpp \
            app/src/main/cpp/include/dmcresource/decode.h \
            app/src/main/cpp/include/dmcresource/hits_decode.h \
            app/src/main/cpp/include/dmcresource/text_decode.h; do
            test ! -e "$path"
          done

      - name: Build and run four-module registry regression
        run: |
          set -euxo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp/include \
            -Iapp/src/main/cpp/vendor/dmc-rengine-cpp/include \
            app/src/test/native/module_registry_test.cpp \
            app/src/main/cpp/dmc_resource.cpp \
            app/src/main/cpp/decode_pipeline.cpp \
            app/src/main/cpp/inspection_format.cpp \
            app/src/main/cpp/adapters/mod_adapter.cpp \
            app/src/main/cpp/adapters/scm_adapter.cpp \
            app/src/main/cpp/modules/module_registry.cpp \
            app/src/main/cpp/modules/module_model.cpp \
            app/src/main/cpp/modules/module_texture.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/binary/reader.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/spider/native_executor.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/codecs/dds_bc.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/profiles/dmc3/texture_slot_framing.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod_skin.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/transform_domain.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/world_transform.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_layout.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_topology.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_validation.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_transform.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_hierarchy.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm.cpp \
            -o /tmp/dmc-core-registry-test
          /tmp/dmc-core-registry-test

      - name: Build and run MOD SCM pipeline regression
        run: |
          set -euxo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp/include \
            -Iapp/src/main/cpp/vendor/dmc-rengine-cpp/include \
            app/src/test/native/core_model_pipeline_test.cpp \
            app/src/main/cpp/dmc_resource.cpp \
            app/src/main/cpp/decode_pipeline.cpp \
            app/src/main/cpp/inspection_format.cpp \
            app/src/main/cpp/adapters/mod_adapter.cpp \
            app/src/main/cpp/adapters/scm_adapter.cpp \
            app/src/main/cpp/modules/module_registry.cpp \
            app/src/main/cpp/modules/module_model.cpp \
            app/src/main/cpp/modules/module_texture.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/binary/reader.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/spider/native_executor.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/codecs/dds_bc.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/profiles/dmc3/texture_slot_framing.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod_skin.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/transform_domain.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/world_transform.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_layout.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_topology.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_validation.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_transform.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_hierarchy.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm.cpp \
            -o /tmp/dmc-core-model-pipeline-test
          /tmp/dmc-core-model-pipeline-test

      - name: Build and run DDS PTX validation regression
        run: |
          set -euxo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp/include \
            -Iapp/src/main/cpp/vendor/dmc-rengine-cpp/include \
            app/src/test/native/dds_ptx_v1_test.cpp \
            app/src/main/cpp/dmc_resource.cpp \
            app/src/main/cpp/decode_pipeline.cpp \
            app/src/main/cpp/inspection_format.cpp \
            app/src/main/cpp/adapters/mod_adapter.cpp \
            app/src/main/cpp/adapters/scm_adapter.cpp \
            app/src/main/cpp/modules/module_registry.cpp \
            app/src/main/cpp/modules/module_model.cpp \
            app/src/main/cpp/modules/module_texture.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/binary/reader.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/spider/native_executor.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/codecs/dds_bc.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/profiles/dmc3/texture_slot_framing.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod_skin.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/transform_domain.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/world_transform.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_layout.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_topology.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_validation.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_transform.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm_hierarchy.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/scm.cpp \
            -o /tmp/dmc-core-dds-ptx-test
          /tmp/dmc-core-dds-ptx-test

      - name: Build and run MOD spatial adapter regression
        run: |
          set -euxo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp/include \
            -Iapp/src/main/cpp/vendor/dmc-rengine-cpp/include \
            app/src/test/native/mod_spatial_adapter_test.cpp \
            app/src/main/cpp/adapters/mod_adapter.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/binary/reader.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod_skin.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/transform_domain.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod/world_transform.cpp \
            app/src/main/cpp/vendor/dmc-rengine-cpp/src/formats/mod.cpp \
            -o /tmp/dmc-mod-spatial-adapter-test
          /tmp/dmc-mod-spatial-adapter-test

      - name: Build and run RenderScene regression
        run: |
          set -euxo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic \
            -Iapp/src/main/cpp/include \
            app/src/test/native/render_scene_test.cpp \
            app/src/main/cpp/view_renderer.cpp \
            -o /tmp/dmc-render-scene-test
          /tmp/dmc-render-scene-test

      - name: Build and run capability UI policy regression
        run: |
          set -euxo pipefail
          rm -rf /tmp/dmc-ui-policy-test
          mkdir -p /tmp/dmc-ui-policy-test
          javac -d /tmp/dmc-ui-policy-test \
            app/src/main/java/com/dmcrengine/nativeviewer/ResourceUiState.java \
            app/src/test/java/com/dmcrengine/nativeviewer/ResourceUiStateTest.java
          java -cp /tmp/dmc-ui-policy-test com.dmcrengine.nativeviewer.ResourceUiStateTest

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK core-only module surface
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK"
          unzip -p "$APK" lib/arm64-v8a/libdmcviewer.so > /tmp/libdmcviewer.so

          strings /tmp/libdmcviewer.so | grep -Fq 'formats.mod.mesh-reader'
          strings /tmp/libdmcviewer.so | grep -Fq 'formats.scm.mesh-reader'
          strings /tmp/libdmcviewer.so | grep -Fq 'formats.texture.spider-reader'
          strings /tmp/libdmcviewer.so | grep -Fq 'spider.native-executor'
          strings /tmp/libdmcviewer.so | grep -Fq 'native.uv-projection'

          for legacy in \
            'formats.hits.collision-reader' \
            'formats.stage-txt.lexer' \
            'formats.dca.record-reader' \
            'formats.lig2.record-reader' \
            'formats.pac.relative-slot-reader' \
            'formats.pnst.relative-slot-reader' \
            'formats.nbz.container-reader' \
            'formats.efm.family-adapter' \
            'formats.mrp.family-adapter' \
            'formats.shw.family-adapter' \
            'formats.mot.recognition'; do
            if strings /tmp/libdmcviewer.so | grep -Fq "$legacy"; then
              echo "legacy module leaked into core APK: $legacy"
              exit 1
            fi
          done

          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | grep -Fq "package: name='com.dmcrengine.nativereader'"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | tee /tmp/manifest.txt
          grep -Fq 'application/vnd.dmc.scm' /tmp/manifest.txt
          grep -Fq 'application/vnd.dmc.mod' /tmp/manifest.txt
          grep -Fq 'application/vnd.dmc.ptx' /tmp/manifest.txt
          grep -Fq 'image/vnd-ms.dds' /tmp/manifest.txt
          ! grep -Fq 'application/vnd.dmc.hits' /tmp/manifest.txt
          ! grep -Fq 'application/vnd.dmc.pac' /tmp/manifest.txt
          ! grep -Fq 'application/vnd.dmc.pnst' /tmp/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dmc-native-reader-core-debug
          path: app/build/outputs/apk/debug/app-debug.apk
