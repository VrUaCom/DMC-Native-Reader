name: DMC Native Reader core architecture

on:
  push:
    branches: ["main", "feature/png-export-multi-mod-v27"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request defaults to refs/pull/<n>/merge. Phase/release evidence
          # must instead bind to the exact candidate head that will be reviewed
          # and handed to device acceptance.
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          submodules: recursive

      - name: Verify exact source checkout
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git status --short

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Verify C++23 and Spider C++ product contract
        run: |
          set -euxo pipefail
          grep -Fq 'cxx_std_23' app/src/main/cpp/CMakeLists.txt
          ! grep -Fq 'cxx_std_20' app/src/main/cpp/CMakeLists.txt
          grep -Fq 'CXX_STANDARD 23' app/src/main/cpp/CMakeLists.txt
          grep -Fq 'CXX_STANDARD_REQUIRED ON' app/src/main/cpp/CMakeLists.txt
          grep -Fq 'CXX_EXTENSIONS OFF' app/src/main/cpp/CMakeLists.txt
          grep -Fq 'DMC_NATIVE_READER_CORE_SOURCES' app/src/main/cpp/CMakeLists.txt
          grep -Fq 'Duplicate source entry in DMC_NATIVE_READER_CORE_SOURCES' app/src/main/cpp/CMakeLists.txt
          grep -Fq 'DMC_NATIVE_READER_TESTS' app/src/main/cpp/CMakeLists.txt
          grep -Fq 'Duplicate test entry in DMC_NATIVE_READER_TESTS' app/src/main/cpp/CMakeLists.txt
          ! grep -F -- '-std=c++' app/build.gradle.kts
          grep -Fq 'ndkVersion = "30.0.16248370"' app/build.gradle.kts
          test -f app/src/main/cpp/include/dmcresource/cpp23_profile.h
          test -f app/src/main/cpp/include/dmcresource/spider/cpp23_language.h
          grep -Fq 'std::expected' app/src/main/cpp/include/dmcresource/cpp23_profile.h
          grep -Fq 'DMC_NATIVE_READER_LANGUAGE_LEVEL' app/src/main/cpp/include/dmcresource/cpp23_profile.h
          grep -Fq 'spider.cpp23' app/src/main/cpp/include/dmcresource/spider/cpp23_language.h
          grep -Fq 'cxx23_profile' app/src/main/cpp/CMakeLists.txt

      - name: Reject archived legacy source paths
        run: |
          set -euxo pipefail
          for path in \
            app/src/main/cpp/decode_hits.cpp \
            app/src/main/cpp/decode_text.cpp \
            app/src/main/cpp/decode_status.cpp \
            app/src/main/cpp/modules/module_hits.cpp \
            app/src/main/cpp/modules/module_text.cpp \
            app/src/main/cpp/modules/module_structural.cpp \
            app/src/main/cpp/modules/module_catalog.cpp \
            app/src/main/cpp/include/dmcresource/decode.h \
            app/src/main/cpp/include/dmcresource/hits_decode.h \
            app/src/main/cpp/include/dmcresource/text_decode.h \
            app/src/main/java/com/dmcrengine/nativeviewer/ResourceUiState.java \
            app/src/test/java/com/dmcrengine/nativeviewer/ResourceUiStateTest.java; do
            test ! -e "$path"
          done

          # DMC Rengine owns SCM strip-break semantics. Native Reader may only
          # project the canonical strip into its renderer representation.
          grep -Fq 'generate_triangle_strip_indices' app/src/main/cpp/adapters/scm_adapter.cpp
          ! grep -Fq 'triangle_break_bit' app/src/main/cpp/adapters/scm_adapter.cpp

          # DMC Rengine also owns MOD bit-15 topology state. Prefer the typed
          # decoded skin flag and use the canonical mask only for zero-domain
          # files; never restore a Reader-local control-word literal.
          grep -Fq 'source.skin[vertex].skin.topology_break' app/src/main/cpp/adapters/mod_adapter.cpp
          grep -Fq 'CanonicalMod::topology_break_mask' app/src/main/cpp/adapters/mod_adapter.cpp
          ! grep -Eq 'control_words.*0x8000' app/src/main/cpp/adapters/mod_adapter.cpp

      - name: Run exact-head Phase 2 host + Android evidence baseline
        run: |
          python3 tools/run_phase2_exact_head.py \
            --sdk "$ANDROID_SDK_ROOT" \
            --gradle gradle \
            --expected-head "$EXPECTED_SOURCE_SHA"

      - name: Verify APK modular core surface
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK"

          # The Phase 2 runner/verifier above is authoritative for exact physical
          # DSO count, 16 KiB ZIP alignment, Java/JNI export parity, signer,
          # package-size budgets and duplicate-payload metrics. This step keeps
          # capability/module checks readable in CI.
          mapfile -t LIBS < <(zipinfo -1 "$APK" | grep '^lib/.*\.so$')
          test "${#LIBS[@]}" -eq 1
          test "${LIBS[0]}" = 'lib/arm64-v8a/libdmcviewer.so'
          unzip -p "$APK" lib/arm64-v8a/libdmcviewer.so > /tmp/libdmcviewer.so
          strings /tmp/libdmcviewer.so > /tmp/native-markers.txt

          grep -Fq 'formats.mod.mesh-reader' /tmp/native-markers.txt
          grep -Fq 'formats.scm.mesh-reader' /tmp/native-markers.txt
          grep -Fq 'formats.texture.spider-reader' /tmp/native-markers.txt
          grep -Fq 'formats.evt.structural-reader' /tmp/native-markers.txt
          grep -Fq 'spider.crusader' /tmp/native-markers.txt
          grep -Fq 'spider.cpp23' /tmp/native-markers.txt
          grep -Fq 'canonical.mod.topology-break' /tmp/native-markers.txt
          grep -Fq 'canonical.scm.topology' /tmp/native-markers.txt
          grep -Fq 'native.texture-set' /tmp/native-markers.txt
          grep -Fq 'native.uv-projection' /tmp/native-markers.txt

          ! grep -Fq 'libdmcshim' /tmp/native-markers.txt
          ! grep -Fq 'libdmccore00' /tmp/native-markers.txt

          for legacy in \
            'formats.hits.collision-reader' \
            'formats.stage-txt.lexer' \
            'formats.dca.record-reader' \
            'formats.lig2.record-reader' \
            'formats.pac.relative-slot-reader' \
            'formats.pnst.relative-slot-reader' \
            'formats.nbz.container-reader' \
            'formats.efm.family-adapter' \
            'formats.mrp.family-adapter' \
            'formats.shw.family-adapter' \
            'formats.mot.recognition'; do
            if grep -Fq "$legacy" /tmp/native-markers.txt; then
              echo "legacy module leaked into core APK: $legacy"
              exit 1
            fi
          done

          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" > /tmp/core-badging.txt
          grep -Fq "package: name='com.dmcrengine.nativereader'" /tmp/core-badging.txt
          grep -Fq "versionCode='33' versionName='1.0.6'" /tmp/core-badging.txt
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml | tee /tmp/manifest.txt
          grep -Fq 'application/vnd.dmc.scm' /tmp/manifest.txt
          grep -Fq 'application/vnd.dmc.mod' /tmp/manifest.txt
          grep -Fq 'application/vnd.dmc.ptx' /tmp/manifest.txt
          grep -Fq 'image/vnd-ms.dds' /tmp/manifest.txt
          grep -Fq 'application/vnd.dmc.eventtbl' /tmp/manifest.txt
          ! grep -Fq 'application/vnd.dmc.hits' /tmp/manifest.txt
          ! grep -Fq 'application/vnd.dmc.pac' /tmp/manifest.txt
          ! grep -Fq 'application/vnd.dmc.pnst' /tmp/manifest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dmc-native-reader-v33-modular-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dmc-native-reader-v33-phase2-evidence
          path: build/phase2-evidence/
          if-no-files-found: error
