name: DMC Native Reader DDS PTX core gate

# Migration batching policy: this targeted host gate is cheap relative to the
# full Android gate, but it still must not run for every synchronize commit in a
# draft migration PR. Use workflow_dispatch during development, or run once when
# the full candidate is marked Ready for review.
on:
  pull_request:
    branches: ["main"]
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  dds-ptx-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          submodules: recursive

      - name: Verify exact source checkout
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          grep -Fq 'cxx_std_23' app/src/main/cpp/CMakeLists.txt
          ! grep -Fq 'cxx_std_20' app/src/main/cpp/CMakeLists.txt

      - name: Build DDS/PTX and model texture regressions
        run: |
          set -euxo pipefail
          cmake -S app/src/main/cpp -B build/host \
            -DDMC_NATIVE_READER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host --parallel 2
          ctest --test-dir build/host --output-on-failure \
            -R 'dds_ptx_v1|ptx_model_texture|black_widow_state'
