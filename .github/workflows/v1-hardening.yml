name: DMC Native Reader v1 hardening

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Guard repository signing boundary
        shell: bash
        run: |
          set -euxo pipefail

          # No private-key material may be tracked in the public tree.
          if git ls-files | grep -Ei '\.(jks|keystore|p12|pfx|pem|key)$'; then
            echo 'tracked signing/private-key material is forbidden'
            exit 1
          fi

          test ! -d keys
          grep -Fq 'applicationIdSuffix = ".debug"' app/build.gradle.kts
          ! grep -Fq 'stableDebug' app/build.gradle.kts
          ! grep -Fq 'dmc-native-reader-test.jks' app/build.gradle.kts

          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('app/build.gradle.kts').read_text()
          release = re.search(r'\brelease\s*\{([^}]*)\}', text, re.S)
          assert release is not None, 'release buildType missing'
          assert re.search(r'\bsigningConfig\s*=', release.group(1)) is None, \
              'release must not embed a repository signingConfig'
          PY

      - name: Build debug and unsigned release APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Verify package and signing separation
        shell: bash
        run: |
          set -euxo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          unzip -t "$DEBUG_APK"
          unzip -t "$RELEASE_APK"

          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          "$AAPT2" dump badging "$DEBUG_APK" | tee /tmp/debug-badging.txt
          "$AAPT2" dump badging "$RELEASE_APK" | tee /tmp/release-badging.txt

          grep -q "package: name='com.dmcrengine.nativereader.debug'" /tmp/debug-badging.txt
          grep -q "versionCode='20'" /tmp/debug-badging.txt
          grep -q "versionName='1.0.0-debug'" /tmp/debug-badging.txt
          grep -q "application-label:'DMC Native Reader'" /tmp/debug-badging.txt

          grep -q "package: name='com.dmcrengine.nativereader'" /tmp/release-badging.txt
          grep -q "versionCode='20'" /tmp/release-badging.txt
          grep -q "versionName='1.0.0'" /tmp/release-badging.txt
          grep -q "application-label:'DMC Native Reader'" /tmp/release-badging.txt

          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK" | tee /tmp/debug-signing.txt
          if "$APKSIGNER" verify "$RELEASE_APK"; then
            echo 'Gradle release APK unexpectedly contains a signing authority'
            exit 1
          fi

          unzip -p "$DEBUG_APK" lib/arm64-v8a/libdmcviewer.so > /tmp/libdmcviewer.so
          strings /tmp/libdmcviewer.so | grep -Fq 'formats.mod.mesh-reader'
          strings /tmp/libdmcviewer.so | grep -Fq 'formats.scm.mesh-reader'
          strings /tmp/libdmcviewer.so | grep -Fq 'formats.dds.dmc3-reader'
          strings /tmp/libdmcviewer.so | grep -Fq 'formats.ptx.bundle-reader'

          sha256sum "$DEBUG_APK" | tee /tmp/debug-apk.sha256
          sha256sum "$RELEASE_APK" | tee /tmp/release-apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dmc-native-reader-v1.0.0-public-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: dmc-native-reader-v1.0.0-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: dmc-native-reader-v1.0.0-hardening-evidence
          path: |
            /tmp/debug-badging.txt
            /tmp/release-badging.txt
            /tmp/debug-signing.txt
            /tmp/debug-apk.sha256
            /tmp/release-apk.sha256
          if-no-files-found: error
          retention-days: 14
