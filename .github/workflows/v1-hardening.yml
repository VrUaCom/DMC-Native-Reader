name: DMC Native Reader v1 hardening

on:
  pull_request:
    branches: ["feature/mod-texture-state"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Guard signing boundary
        run: |
          set -euxo pipefail
          grep -q 'stableDebug' app/build.gradle.kts
          grep -q 'dmc-native-reader-test.jks' app/build.gradle.kts
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('app/build.gradle.kts').read_text()
          match = re.search(r'\brelease\s*\{([^}]]*)\}', text, re.S)
          assert match is not None, 'release buildType missing'
          assert 'signingConfig' not in match.group(1), 'release must not use the debug/test signer'
          PY

      - name: Build debug and unsigned release APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Verify v1 hardening artifacts
        run: |
          set -euxo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          unzip -t "$DEBUG_APK"
          unzip -t "$RELEASE_APK"

          AAPT2="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$DEBUG_APK" | tee /tmp/debug-badging.txt
          "$AAPT2" dump badging "$RELEASE_APK" | tee /tmp/release-badging.txt

          for BADGING in /tmp/debug-badging.txt /tmp/release-badging.txt; do
            grep -q "package: name='com.dmcrengine.nativereader'" "$BADGING"
            grep -q "versionCode='15'" "$BADGING"
            grep -q "versionName='1.1.3-debug-v1-hardening'" "$BADGING"
            grep -q "application-label:'DMC Native Reader'" "$BADGING"
            ! grep -q 'DMC Native Reader v8' "$BADGING"
          done

          unzip -p "$DEBUG_APK" lib/arm64-v8a/libdmcviewer.so > /tmp/libdmcviewer.so
          strings /tmp/libdmcviewer.so | grep -q 'formats.mod.mesh-reader'
          strings /tmp/libdmcviewer.so | grep -q 'canonical.mod.spatial-hierarchy'
          strings /tmp/libdmcviewer.so | grep -q 'canonical.mod.texture-state'
          strings /tmp/libdmcviewer.so | grep -q 'formats.scm.mesh-reader'

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK" | tee /tmp/debug-signing.txt
          tr -d ': ' < /tmp/debug-signing.txt | grep -qi 'f483539463f89dd957a8f7c68a3bb75da17450163f2e8767b4c47d5f1899adac'
          if "$APKSIGNER" verify "$RELEASE_APK"; then
            echo 'release APK unexpectedly has a signing authority'
            exit 1
          fi

          sha256sum "$DEBUG_APK" | tee /tmp/debug-apk.sha256
          sha256sum "$RELEASE_APK" | tee /tmp/release-apk.sha256

      - name: Upload hardening debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dmc-native-reader-v1.1.3-debug-v1-hardening
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload hardening evidence
        uses: actions/upload-artifact@v4
        with:
          name: dmc-native-reader-v1.1.3-hardening-evidence
          path: |
            /tmp/debug-badging.txt
            /tmp/release-badging.txt
            /tmp/debug-signing.txt
            /tmp/debug-apk.sha256
            /tmp/release-apk.sha256
          if-no-files-found: error
